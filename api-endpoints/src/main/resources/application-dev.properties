# RabbitMQ: connection details
rabbitmq-host=my-rabbit
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest

# RabbitMQ: Outgoing exchange and routing key config
mp.messaging.outgoing.idMapper.connector=smallrye-rabbitmq
mp.messaging.outgoing.idMapper.exchange.name=exchange_id_mapper
mp.messaging.outgoing.idMapper.exchange.type=direct
mp.messaging.outgoing.idMapper.default-routing-key=routing_id_lookup_with_ctx

# ArangoDB
cache.hosts=my-arangodb:8529
cache.password=openSesame


# *** Development environment ONLY! ***
# Quarkus: Needed for Quarkus Dev Mode and code reloading. Must not be used in production environment!
quarkus.package.type=mutable-jar
quarkus.live-reload.password=changeit
quarkus.live-reload.url=http://localhost:9081