# RabbitMQ: connection details
rabbitmq-host=my-rabbit
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest

# RabbitMQ: Outgoing exchange and routing key config
mp.messaging.outgoing.idMapper.connector=smallrye-rabbitmq
mp.messaging.outgoing.idMapper.exchange.name=exchange_id_mapper
mp.messaging.outgoing.idMapper.exchange.type=direct
mp.messaging.outgoing.idMapper.default-routing-key=routing_id_lookup_with_ctx

# RabbitMQ: Incoming status events from the workers (claimed / done / failed).
# The gateway is the only component writing worker output to the cache.
mp.messaging.incoming.lookupStatus.connector=smallrye-rabbitmq
mp.messaging.incoming.lookupStatus.exchange.name=exchange_id_mapper
mp.messaging.incoming.lookupStatus.exchange.type=direct
mp.messaging.incoming.lookupStatus.routing-keys=routing_id_lookup_status
mp.messaging.incoming.lookupStatus.queue.name=queue_id_lookup_status

# ArangoDB
cache.hosts=my-arangodb:8529
cache.password=openSesame

# Cache TTL (in seconds). Documents older than this value (measured from
# their createdAt attribute) are removed by ArangoDB's TTL background job.
# Set to 0 (or a negative value) to disable expiry.
cache.ttl-seconds=3600

# Lookup timeout: requests still pending/in_progress this many seconds after
# createdAt are marked "timed-out" by a periodic sweep. Set to 0 (or a
# negative value) to disable. The sweep cadence accepts any Quarkus duration,
# or "off" to disable the scheduled trigger.
lookup.timeout-seconds=60
lookup.timeout-sweep-every=10s


# *** Development environment ONLY! ***
# Quarkus: Needed for Quarkus Dev Mode and code reloading. Must not be used in production environment!
quarkus.package.type=mutable-jar
quarkus.live-reload.password=changeit
quarkus.live-reload.url=http://localhost:9081
# OpenTelemetry: traces are exported over OTLP to the Jaeger container
# (service graph + per-lookup waterfall at http://localhost:16686).
# Disabled in tests: no collector runs there.
quarkus.otel.service.name=api-endpoints
quarkus.otel.exporter.otlp.traces.endpoint=http://my-jaeger:4317
%test.quarkus.otel.sdk.disabled=true
