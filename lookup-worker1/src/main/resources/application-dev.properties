# RabbitMQ: connection details
rabbitmq-host=my-rabbit
rabbitmq-port=5672
rabbitmq-username=guest
rabbitmq-password=guest

# RabbitMQ: Incoming exchange, routing key & queue config
mp.messaging.incoming.idMapper.connector=smallrye-rabbitmq
mp.messaging.incoming.idMapper.exchange.name=exchange_id_mapper
mp.messaging.incoming.idMapper.exchange.type=direct
mp.messaging.incoming.idMapper.routing-keys=routing_id_lookup_with_ctx
mp.messaging.incoming.idMapper.queue.name=queue_lookup_worker1

# RabbitMQ: Outgoing status events (claimed / done / failed), consumed by the
# API gateway, which owns all writes to the result cache.
mp.messaging.outgoing.lookupStatus.connector=smallrye-rabbitmq
mp.messaging.outgoing.lookupStatus.exchange.name=exchange_id_mapper
mp.messaging.outgoing.lookupStatus.exchange.type=direct
mp.messaging.outgoing.lookupStatus.default-routing-key=routing_id_lookup_status


# *** Development environment ONLY! ***
# Quarkus: Needed for Quarkus Dev Mode and code reloading. Must not be used in production environment!
quarkus.package.type=mutable-jar
quarkus.live-reload.password=changeit
quarkus.live-reload.url=http://localhost:9085

# Contexts this worker answers; requests in other contexts are ignored
# without a claim. Comma-separated, matched case-insensitively.
worker.contexts=TAG

# OpenTelemetry: traces are exported over OTLP to the Jaeger container
# (service graph + per-lookup waterfall at http://localhost:16686).
# Disabled in tests: no collector runs there. Note: the quarkus-microprofile
# umbrella disables the OTel SDK by default (MP Telemetry spec), so it is
# re-enabled explicitly here.
quarkus.otel.sdk.disabled=false
quarkus.otel.service.name=lookup-worker-1
quarkus.otel.exporter.otlp.endpoint=http://my-jaeger:4317
quarkus.otel.exporter.otlp.traces.endpoint=http://my-jaeger:4317
# The MP-style otel.* names are set too: the quarkus-microprofile umbrella
# ships MP defaults (localhost:4317) that would otherwise win the lookup.
otel.service.name=lookup-worker-1
otel.exporter.otlp.endpoint=http://my-jaeger:4317
otel.exporter.otlp.traces.endpoint=http://my-jaeger:4317
%test.quarkus.otel.sdk.disabled=true
