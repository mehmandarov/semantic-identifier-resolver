services:
  rabbitmq:
    image: 'rabbitmq:3-management'
    hostname: my-rabbit
    container_name: some-rabbit
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro  # Mount config file (read-only)
    networks:
      - semantic_identifier_resolver_default
    ports:
      - '15672:15672'
      - '5672:5672'

  arangodb:
    image: 'arangodb:3.11.6'
    hostname: my-arangodb
    container_name: some-arangodb
    environment:
      - ARANGO_ROOT_PASSWORD=${TOP_SECRET}
    env_file:
      - .env.arangodb
    networks:
      - semantic_identifier_resolver_default
    ports:
      - '8529:8529'

  jaeger:
    image: 'jaegertracing/all-in-one:1.62.0'
    hostname: my-jaeger
    container_name: some-jaeger
    networks:
      - semantic_identifier_resolver_default
    ports:
      - '16686:16686'   # UI
      - '4317:4317'     # OTLP gRPC ingest

  apiEndpoints:
    image: "com.demo.website:api-endpoints"
    hostname: "api-endpoints"
    container_name: "api-endpoints"
    environment:
      - CACHE_PASSWORD=${TOP_SECRET}
    ports:
      - "9081:8080"
    networks:
      - semantic_identifier_resolver_default
    build:
      context: ./api-endpoints
      dockerfile: DEV.Dockerfile
    links:
      - "rabbitmq:some-rabbit"
      - "arangodb:some-arangodb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  lookupworker1:
    image: "com.demo.website:lookup-worker1"
    hostname: "lookup-worker-1"
    container_name: "lookup-worker-1"
    ports:
      - "9085:8080"
    networks:
      - semantic_identifier_resolver_default
    build:
      context: ./lookup-worker1
      dockerfile: DEV.Dockerfile
    links:
      - "apiEndpoints:api-endpoints"
      - "rabbitmq:some-rabbit"
    depends_on:
      apiEndpoints:
        condition: service_healthy

  lookupworker2:
    image: "com.demo.website:lookup-worker2"
    hostname: "lookup-worker-2"
    container_name: "lookup-worker-2"
    environment:
      # FAKE demo-only slowdown (worker.fake-processing-delay-ms). Off (0)
      # unless WORKER2_FAKE_DELAY_MS is set when bringing the service up.
      - WORKER_FAKE_PROCESSING_DELAY_MS=${WORKER2_FAKE_DELAY_MS:-0}
    ports:
      - "9086:8080"
    networks:
      - semantic_identifier_resolver_default
    build:
      context: ./lookup-worker2
      dockerfile: DEV.Dockerfile
    links:
      - "apiEndpoints:api-endpoints"
      - "rabbitmq:some-rabbit"
    depends_on:
      apiEndpoints:
        condition: service_healthy

  lookupworker3:
    image: "com.demo.website:lookup-worker3"
    hostname: "lookup-worker-3"
    container_name: "lookup-worker-3"
    ports:
      - "9087:8080"
    networks:
      - semantic_identifier_resolver_default
    build:
      context: ./lookup-worker3
      dockerfile: DEV.Dockerfile
    links:
      - "apiEndpoints:api-endpoints"
      - "rabbitmq:some-rabbit"
    depends_on:
      apiEndpoints:
        condition: service_healthy

networks:
  semantic_identifier_resolver_default:
    name: semantic_identifier_resolver_default
    external: false