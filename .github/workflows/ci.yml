name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '25' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # ubuntu-latest ships a running Docker daemon, so Testcontainers
      # (used by the api-endpoints end-to-end suite) works out of the box.
      - name: Verify Docker is available
        run: docker version

      - name: Build, test and run end-to-end suite
        run: mvn -B -ntp verify -DskipITs=false

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: |
            api-endpoints/target/jacoco-report/
            api-endpoints/target/site/jacoco/
            api-endpoints/target/site/jacoco-it/
          if-no-files-found: ignore

      - name: Upload Surefire & Failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
