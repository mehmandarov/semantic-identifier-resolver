version: 2
updates:
  # Maven dependencies across the whole multi-module project (root pom
  # + api-endpoints + lookup-worker1). Grouped so a single PR bumps
  # related Quarkus artefacts together instead of one PR per module.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    groups:
      quarkus:
        patterns:
          - "io.quarkus*"
          - "io.quarkiverse*"
          - "io.smallrye*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "io.rest-assured*"
          - "org.awaitility*"
          - "org.jacoco*"

  # Keep the GitHub Actions used by the CI workflow up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
